<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Galo Bet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-auth">
        <div class="caixa-auth">
            <div class="logo">
                <h1>Galo Bet</h1>
            </div>
            <h2>Acesse sua conta</h2>
            <form id="form-login">
                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Seu e-mail" required>
                </div>
                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn-principal btn-block">Entrar</button>
            </form>
            <p class="link-rodape">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            <p class="voltar-home"><a href="index.html">← Voltar para o Início</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
